whisper:
  model: "large-v2"
  language: "en"
  device: "cuda"
  compute_type: "float16"

diarization:

  hf_token: ""
  min_speakers: null
  max_speakers: null

speaker_mapping:
  similarity_threshold: 0.75
  voice_profiles_dir: "models/voice_profiles"

scene_analysis:
  enabled: true
  mode: "cena"


  frames_per_scene: 12

  gap_threshold_seconds: 3.0
  padding_seconds: 0.5

  load_in_4bit: false

  model: "Qwen/Qwen2.5-VL-7B-Instruct"

  language: "en-US"

  max_new_tokens: 400

  validation_max_new_tokens: 1200   # etapa de revisão da análise final (documento inteiro, precisa de mais espaço)

  # Consistência de personagens entre cenas: monta uma ficha por
  # personagem (juntando todas as cenas) e reescreve cada cena usando
  # nomes/rótulos consistentes - só texto, sem reprocessar frames.
  enable_character_consistency: true
  character_sheet_max_new_tokens: 800   # ficha consolidada (documento com todos os personagens)
  consistency_max_new_tokens: 300       # reescrita de UMA cena por vez

  repetition_penalty: 1.15
  # no_repeat_ngram_size bane qualquer sequência de N tokens repetida em
  # TODA a entrada (incluindo o prompt) — em prompts longos e repetitivos
  # (diálogo com o mesmo nome de personagem várias vezes, blocos de cena
  # repetidos) isso pode corromper a grafia de nomes e cabeçalhos. Deixe
  # null (desligado) a menos que veja loops de repetição real no texto
  # gerado; nesse caso use um valor alto (8+), nunca 2 ou 3.
  no_repeat_ngram_size: null
  do_sample: false

  question: ""
output:
  formats: ["txt", "json", "srt"]
  output_dir: "resultados"