whisper:
  model: "large-v2"
  language: "en"
  device: "cuda"
  compute_type: "float16"

diarization:

  hf_token: ""
  min_speakers: null
  max_speakers: null

speaker_mapping:
  similarity_threshold: 0.75
  voice_profiles_dir: "models/voice_profiles"

scene_analysis:
  enabled: true
  mode: "cena"


  frames_per_scene: 12

  gap_threshold_seconds: 3.0
  padding_seconds: 0.5

  load_in_4bit: false

  model: "Qwen/Qwen2.5-VL-7B-Instruct"

  language: "en-US"

  max_new_tokens: 400

  repetition_penalty: 1.15
  no_repeat_ngram_size: 3
  do_sample: false

  question: ""
output:
  formats: ["txt", "json", "srt"]
  output_dir: "resultados"